<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود - RezaFood Web</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/web_shared.css') }}">
  <style>
    :root {
      --bg: #0f172a;
      --bg-2: #1e293b;
      --panel: rgba(15, 23, 42, 0.72);
      --panel-border: rgba(148, 163, 184, 0.24);
      --muted: #94a3b8;
      --danger: #fb7185;
      --radius: 16px;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 15%, #0ea5e933, transparent 35%),
        radial-gradient(circle at 85% 85%, #22d3ee22, transparent 30%),
        linear-gradient(160deg, var(--bg), var(--bg-2));
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(2, 6, 23, 0.55);
      opacity: 0;
      transform: translateY(12px) scale(0.98);
      animation: cardIn 0.6s var(--ease) 0.05s forwards;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
      color: #e0f2fe;
      font-weight: 700;
      font-size: 20px;
    }

    .brand .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 14px #22d3ee88;
      animation: pulseDot 1.9s ease-in-out infinite;
    }

    h2 {
      margin: 0 0 6px;
      font-size: 22px;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .field { margin-top: 10px; }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #cbd5e1;
    }

    input,
    button {
      width: 100%;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
    }

    input::placeholder { color: #64748b; }

    button {
      margin-top: 14px;
      isolation: isolate;
    }

    .flash {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #7f1d1d66;
      border: 1px solid #fb718555;
      color: #fecdd3;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <form class="card" method="post" action="/login">
      <div class="brand"><span class="dot"></span><span>RezaFood POS</span></div>
      <h2>ورود به حساب کاربری</h2>
      <p class="subtitle">برای ادامه، نام کاربری و رمز عبور را وارد کنید</p>

      <div class="field">
        <label for="username">نام کاربری</label>
        <input id="username" name="username" placeholder="مثال: admin" required>
      </div>

      <div class="field">
        <label for="password">رمز عبور</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required>
      </div>

      <button type="submit">ورود</button>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash">{{ messages[-1] }}</div>
        {% endif %}
      {% endwith %}
    </form>
  </div>
</body>
</html>
