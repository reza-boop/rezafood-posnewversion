<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود - RezaFood Web</title>
  <style>
    body { font-family: sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 0; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { width: 100%; max-width: 360px; background: #313244; border-radius: 12px; padding: 16px; }
    input, button { width: 100%; padding: 10px; border-radius: 8px; border: none; margin-top: 10px; }
    input { background: #45475a; color: #fff; }
    button { background: #89b4fa; color: #1e1e2e; font-weight: bold; }
    .flash { color: #f38ba8; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <form class="card" method="post" action="/login">
      <h2>ورود به RezaFood</h2>
      <input name="username" placeholder="نام کاربری" required>
      <input name="password" type="password" placeholder="رمز عبور" required>
      <button type="submit">ورود</button>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash">{{ messages[-1] }}</div>
        {% endif %}
      {% endwith %}
    </form>
  </div>
</body>
</html>
