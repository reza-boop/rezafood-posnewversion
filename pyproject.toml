[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rezafood-pos"
version = "11.3.0"
description = "RezaFood Point-of-Sale — a Tkinter desktop POS application"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
rezafood = "app:main"

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-v --tb=short"
python_files  = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["."]
omit   = ["tests/*", "ui/*", "app.py"]

[tool.coverage.report]
show_missing = true
fail_under   = 70
